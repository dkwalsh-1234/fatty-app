<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=412">
<title>Amount sheet, light</title>
<style>
@font-face { font-family: Geist; src: url("fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }
@font-face { font-family: "Geist Mono"; src: url("fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }
html, body { margin: 0; background: #555; }
body { width: 412px; }
</style>
</head>
<body>


<div style="width: 412px; height: 915px; position: relative; overflow: hidden; background: #E8F0E4; color: #0B2D22; font-family: Geist, system-ui, sans-serif">
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 300px; background: #0D2F23; border-radius: 0 0 36px 36px"></div>
  <div style="position: absolute; inset: 0; background: rgba(8,30,23,0.42)"></div>

  <section role="dialog" aria-label="Amount for Mixed salad leaves" style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; background: #FBFBF2; border-radius: 32px 32px 0 0; padding: 0 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: center; padding-top: 8px"><div style="width: 36px; height: 5px; border-radius: 3px; background: #9DB1A3"></div></div>

    <div style="display: flex; align-items: center; justify-content: space-between">
      <button aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: none; padding: 0; color: #496155"><span style="width: 32px; height: 32px; border-radius: 16px; background: #DFE8DB; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></span></button>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <span style="font-size: 18px; font-weight: 600">Mixed salad leaves</span>
        <span style="font-size: 12px; color: #496155">FSANZ · <button style="border: 0; background: none; padding: 0; color: #2E6720; font: inherit; font-weight: 600">Lunch, 12:40</button></span>
      </div>
      <span style="width: 44px"></span>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0 2px">
      <label for="amtb" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Amount in grams</label>
      <div style="display: flex; align-items: center; justify-content: center; height: 104px; min-width: 220px; padding: 0 28px; border-radius: 52px; background: #DFE8DB; box-shadow: 0 0 0 2.5px #2E6720, 0 0 0 8px rgba(46,103,32,0.14)">
        <input id="amtb" type="text" inputmode="decimal" value="45" style="width: 1.15em; border: 0; padding: 0; background: transparent; color: #0B2D22; font-family: inherit; font-size: 84px; font-weight: 300; letter-spacing: -0.05em; text-align: right; outline: none">
        <span aria-hidden="true" style="width: 3px; height: 62px; border-radius: 2px; background: #2E6720"></span>
        <span style="font-size: 30px; font-weight: 400; color: #496155; padding-left: 10px">g</span>
      </div>
      <span style="font-size: 14px; color: #496155; padding-top: 8px; font-variant-numeric: tabular-nums">8 kcal</span>
    </div>

    <div style="display: flex; gap: 8px; justify-content: center">
      <button aria-pressed="true" style="height: 38px; padding: 0 16px; border: 0; border-radius: 19px; background: #0B2D22; color: #C3F556; font: inherit; font-size: 14px; font-weight: 600">Last · 45 g</button>
      <button style="height: 38px; padding: 0 16px; border: 0; border-radius: 19px; background: #DFE8DB; color: inherit; font: inherit; font-size: 14px; font-weight: 500">1 cup · 30 g</button>
      <button style="height: 38px; padding: 0 16px; border: 0; border-radius: 19px; background: #DFE8DB; color: inherit; font: inherit; font-size: 14px; font-weight: 500">100 g</button>
    </div>

    <div aria-label="Nutrition for 45 g" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      
        <div style="height: 60px; box-sizing: border-box; border-radius: 16px; background: #DFE8DB; padding: 7px 12px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 11px; line-height: 14px; color: #496155; white-space: nowrap">Energy</span>
          <span style="font-size: 16px; line-height: 20px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap">8 kcal</span>
          <div style="display: flex; height: 4px; margin-top: 3px; border-radius: 2px; overflow: hidden; background: rgba(11,45,34,0.08)"><div style="width: 67%; background: #496155"></div><div style="width: 6%; background: #0B2D22"></div></div>
          
        </div>
      
        <div style="height: 60px; box-sizing: border-box; border-radius: 16px; background: #DFE8DB; padding: 7px 12px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 11px; line-height: 14px; color: #496155; white-space: nowrap">Protein</span>
          <span style="font-size: 16px; line-height: 20px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap">0.6 g</span>
          <div style="display: flex; height: 4px; margin-top: 3px; border-radius: 2px; overflow: hidden; background: rgba(11,45,34,0.08)"><div style="width: 74.7%; background: #06658E"></div><div style="width: 6%; background: #0B2D22"></div></div>
          
        </div>
      
        <div style="height: 60px; box-sizing: border-box; border-radius: 16px; background: #DFE8DB; padding: 7px 12px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 11px; line-height: 14px; color: #496155; white-space: nowrap">Fat, total</span>
          <span style="font-size: 16px; line-height: 20px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap">0.1 g</span>
          
          
        </div>
      
        <div style="height: 60px; box-sizing: border-box; border-radius: 16px; background: #DFE8DB; padding: 7px 12px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 11px; line-height: 14px; color: #496155; white-space: nowrap">Saturated fat</span>
          <span style="font-size: 16px; line-height: 20px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap">0.0 g</span>
          <div style="display: flex; height: 4px; margin-top: 3px; border-radius: 2px; overflow: hidden; background: rgba(11,45,34,0.08)"><div style="width: 91.4%; opacity: 0.5; background: #CD5537"></div><div style="width: 6%; background: #0B2D22"></div></div>
          
        </div>
      
        <div style="height: 60px; box-sizing: border-box; border-radius: 16px; background: #DFE8DB; padding: 7px 12px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 11px; line-height: 14px; color: #496155; white-space: nowrap">Trans fat</span>
          <span style="font-size: 16px; line-height: 20px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap">0.0 g</span>
          
          
        </div>
      
        <div style="height: 60px; box-sizing: border-box; border-radius: 16px; background: #DFE8DB; padding: 7px 12px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 11px; line-height: 14px; color: #496155; white-space: nowrap">Carbohydrate</span>
          <span style="font-size: 16px; line-height: 20px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap">0.7 g</span>
          <div style="display: flex; height: 4px; margin-top: 3px; border-radius: 2px; overflow: hidden; background: rgba(11,45,34,0.08)"><div style="width: 46.7%; background: #CE7C22"></div><div style="width: 6%; background: #0B2D22"></div></div>
          
        </div>
      
        <div style="height: 60px; box-sizing: border-box; border-radius: 16px; background: #DFE8DB; padding: 7px 12px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 11px; line-height: 14px; color: #496155; white-space: nowrap">Sugars</span>
          <span style="font-size: 16px; line-height: 20px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap">0.6 g</span>
          
          
        </div>
      
        <div style="height: 60px; box-sizing: border-box; border-radius: 16px; background: #DFE8DB; padding: 7px 12px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 11px; line-height: 14px; color: #496155; white-space: nowrap">Fibre</span>
          <span style="font-size: 16px; line-height: 20px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap">0.9 g</span>
          
          
        </div>
      
        <div style="height: 60px; box-sizing: border-box; border-radius: 16px; background: #DFE8DB; padding: 7px 12px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 11px; line-height: 14px; color: #496155; white-space: nowrap">Sodium</span>
          <span style="font-size: 16px; line-height: 20px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap">9 mg</span>
          
          <span style="font-size: 10px; line-height: 12px; color: #496155">(0.02 g salt)</span>
        </div>
      
    </div>

    <button style="height: 54px; border: 0; border-radius: 27px; background: #0B2D22; color: #C3F556; font: inherit; font-size: 17px; font-weight: 600">Save</button>

    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 285px; background: #DCE5D8; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 4px; color: #496155">
      <span style="font-size: 14px; font-weight: 600">System numeric keypad</span>
      <span style="font-size: 12px">inputmode=decimal · Enter saves</span>
    </div>
  </section>
</div>

</body>
</html>
