[versions]
agp = "9.4.1"
kotlin = "2.4.20"
coreKtx = "1.19.1"
activity = "1.13.0"
webkit = "1.17.1"
healthConnect = "1.1.0"
glance = "1.2.0"
datastore = "1.2.1"
work = "2.11.2"
junit = "4.13.2"
orgJson = "20260814"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
health-connect = { module = "androidx.health.connect:connect-client", version.ref = "healthConnect" }

glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }

datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

junit = { module = "junit:junit", version.ref = "junit" }
# Android's org.json is a stub in JVM unit tests; this is the real thing.
org-json = { module = "org.json:json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
